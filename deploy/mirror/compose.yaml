# Headless Sovereign mirror: Caddy terminates TLS and proxies to the mirror,
# which listens on loopback inside the same network namespace.
#
#   cp deploy/mirror/mirror.env.example deploy/mirror/mirror.env   # then edit
#   docker compose --env-file deploy/mirror/mirror.env \
#     -f deploy/mirror/compose.yaml up -d --build
#
# Without SOVEREIGN_MIRROR_CONSENT=yes-i-consent-to-public-serving the mirror
# runs plan-only: it prints its review to the logs and serves nothing.

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SOVEREIGN_MIRROR_DOMAIN: ${SOVEREIGN_MIRROR_DOMAIN:?set SOVEREIGN_MIRROR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  mirror:
    # The published, attested image. Verify it before the first start (see
    # README.md); pin a digest with SOVEREIGN_MIRROR_IMAGE=...@sha256:... .
    # `up --build` builds this checkout instead.
    image: ${SOVEREIGN_MIRROR_IMAGE:-ghcr.io/foxlight-foundation/sovereign-mirror:0.29.0}
    build:
      context: ../..
      dockerfile: deploy/mirror/Dockerfile
    restart: unless-stopped
    # Share Caddy's network namespace: the mirror's 127.0.0.1:8080 listener is
    # reachable by Caddy and by nothing else.
    network_mode: service:caddy
    depends_on:
      - caddy
    environment:
      SOVEREIGN_MIRROR_DOMAIN: ${SOVEREIGN_MIRROR_DOMAIN:?set SOVEREIGN_MIRROR_DOMAIN}
      SOVEREIGN_MIRROR_CONTACT: ${SOVEREIGN_MIRROR_CONTACT:-}
      SOVEREIGN_MIRROR_BUDGET: ${SOVEREIGN_MIRROR_BUDGET:-100G}
      SOVEREIGN_MIRROR_INGRESS_DAILY: ${SOVEREIGN_MIRROR_INGRESS_DAILY:-50G}
      # Upload caps are opt-in: empty means no cap on a new mirror, and an
      # existing mirror keeps the caps it has. "none" removes them.
      SOVEREIGN_MIRROR_EGRESS_DAILY: ${SOVEREIGN_MIRROR_EGRESS_DAILY:-}
      SOVEREIGN_MIRROR_EGRESS_MONTHLY: ${SOVEREIGN_MIRROR_EGRESS_MONTHLY:-}
      # Catalog withdrawal is advisory unless you choose "on"; empty keeps it.
      SOVEREIGN_MIRROR_FOLLOW_WITHDRAWALS: ${SOVEREIGN_MIRROR_FOLLOW_WITHDRAWALS:-}
      SOVEREIGN_MIRROR_GRANT: ${SOVEREIGN_MIRROR_GRANT:-180d}
      SOVEREIGN_MIRROR_COLLECTION: /config/collection.json
      # Optional one-time starter import (see docs/starter-collection.md).
      SOVEREIGN_MIRROR_STARTER_LIST: ${SOVEREIGN_MIRROR_STARTER_LIST:-}
      SOVEREIGN_MIRROR_STARTER_LIST_ID: ${SOVEREIGN_MIRROR_STARTER_LIST_ID:-}
      SOVEREIGN_MIRROR_STARTER_TIER: ${SOVEREIGN_MIRROR_STARTER_TIER:-small}
      SOVEREIGN_MIRROR_STARTER_FORMATS: ${SOVEREIGN_MIRROR_STARTER_FORMATS:-gguf}
      SOVEREIGN_MIRROR_STARTER_ACCEPT_TERMS: ${SOVEREIGN_MIRROR_STARTER_ACCEPT_TERMS:-}
      SOVEREIGN_MIRROR_CONSENT: ${SOVEREIGN_MIRROR_CONSENT:-}
    volumes:
      # A directory holding collection.json and any source file it names,
      # and/or a signed starter list.
      - ${SOVEREIGN_MIRROR_COLLECTION_DIR:-./collection}:/config:ro
      - mirror-data:/data
    # Stopping drains in-flight work and keeps every retained byte.
    stop_grace_period: 2m

volumes:
  caddy-data:
  caddy-config:
  mirror-data:

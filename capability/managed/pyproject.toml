[project]
name = "sovereign-managed-runtime-workspace"
version = "0.1.0"
description = "Isolated POSIX managed runtime recipe, separate from standalone Sovereign"
requires-python = ">=3.13"
dependencies = [
  "skulk-capability-sdk==0.5.16rc1",
  "skulk-capability-nodes==0.18.0rc8",
  "skulk-capability-kernel==0.7.0rc7; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
  "httpx>=0.28,<1",
  "pydantic==2.14.1",
  "PyYAML>=6,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
skulk-capability-sdk = { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/v0.5.16-rc.1/skulk_capability_sdk-0.5.16rc1-py3-none-any.whl" }
skulk-capability-nodes = { url = "https://skulkapps.foxlight.ai/releases/foxlight.sdk-reference/45233353911/macos-arm64/skulk_capability_nodes-0.18.0rc8-py3-none-any.whl" }
skulk-capability-kernel = [
  { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.7/skulk_capability_kernel-0.7.0rc7-cp313-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.7/skulk_capability_kernel-0.7.0rc7-cp313-abi3-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.7/skulk_capability_kernel-0.7.0rc7-cp313-abi3-manylinux_2_34_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

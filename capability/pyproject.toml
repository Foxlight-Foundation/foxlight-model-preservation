[project]
name = "foxlight-preservation-library"
version = "0.22.0"
description = "Library and guided preservation controls for Skulk's durable host jobs"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
desktop = ["foxlight-model-preservation==0.26.0"]
managed = ["skulk-capability-sdk==0.5.0"]

[tool.uv.sources]
foxlight-model-preservation = { path = "..", editable = true }
# Authoring surface only; no private owner/installer code is packaged here.
# This upstream source remains access-controlled until SDK distribution opens.
skulk-capability-sdk = { git = "https://github.com/Foxlight-Foundation/skulk-capability-nodes.git", subdirectory = "sdk-public", rev = "b9dc2e9d0fb7a8466f5ffbb52efebfa6b2f8e259" }

[project.scripts]
foxlight-sovereign = "foxlight_preservation_library.desktop:main"
foxlight-preservation-preview = "foxlight_preservation_library.preview:main"
foxlight-preservation-library = "foxlight_preservation_library.standalone:main"
foxlight-preservation-managed = "foxlight_preservation_library.child:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foxlight_preservation_library"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "basedpyright>=1.31,<2", "build>=1.3,<2", "types-jsonschema", "types-PyYAML"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

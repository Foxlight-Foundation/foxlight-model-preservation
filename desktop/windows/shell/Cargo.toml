[package]
name = "sovereign"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Sovereign for Windows: a window around the bundled Library"

[[bin]]
name = "Sovereign"
path = "src/main.rs"

[dependencies]
serde_json = "1"
webview2-com = "0.39.1"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

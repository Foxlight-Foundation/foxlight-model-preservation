name: Publish graphical Linux APT setup
on:
  push:
    tags: ['sovereign-graphical-setup-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Manual runs rehearse qualification without publication
        type: boolean
        default: true
        required: true
permissions: {}
concurrency:
  group: sovereign-graphical-setup-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the reviewed main ancestor and exact version tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = push ]; then git merge-base --is-ancestor "$GITHUB_SHA" origin/main; fi
          python3 - <<'PY'
          import os, runpy
          setup = runpy.run_path('scripts/build_linux_setup.py')
          if os.environ['EVENT'] == 'push':
              assert os.environ['REF'] == 'refs/tags/sovereign-graphical-setup-v' + setup['SETUP_VERSION']
          else:
              assert os.environ['DRY_RUN'] == 'true'
          PY
  qualify:
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/linux-graphical-setup.yml
  attest:
    if: github.event_name == 'push'
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: sovereign-graphical-setup-*
          path: incoming
      - name: Require identical qualified packages from both native architectures
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          packages = []
          for arch in ('amd64', 'arm64'):
              root = pathlib.Path('incoming/sovereign-graphical-setup-' + arch)
              evidence = json.loads((root / 'sovereign-graphical-setup/qualification.json').read_bytes())
              assert evidence['architecture'] == arch
              assert evidence['high_contrast_review_and_action'] is True
              assert evidence['large_text_review_and_action'] is True
              assert evidence['real_os_password_authentication'] is True
              assert evidence['real_os_permission_cancel_no_changes'] is True
              assert evidence['verified_app_install_and_graphical_handoff'] is True
              assert evidence['ready_window_fits_1024x768_after_permission_retry'] is True
              assert evidence['authorization_bypass_or_cached_grant'] is False
              package, = (root / 'graphical-a').glob('*.deb')
              packages.append(package)
          assert packages[0].read_bytes() == packages[1].read_bytes()
          output = pathlib.Path('dist')
          output.mkdir()
          shutil.copyfile(packages[0], output / packages[0].name)
          shutil.copyfile('docs/linux-graphical-setup.txt', output / 'GETTING-STARTED.txt')
          subjects = sorted(output.iterdir())
          (output / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in subjects))
          PY
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        id: attest
        with:
          subject-path: |
            dist/*.deb
            dist/GETTING-STARTED.txt
            dist/SHA256SUMS
      - name: Retain detached build provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/linux-graphical-setup.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sovereign-graphical-setup-attested
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push'
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sovereign-graphical-setup-attested
          path: dist
      - name: Verify exact source, checksums and every public subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          for file in *.deb GETTING-STARTED.txt SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --bundle linux-graphical-setup.sigstore.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux-graphical-setup-release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          test "$(find . -type f | wc -l)" -eq 4
      - name: Publish the qualified graphical setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          Graphical setup for Sovereign on compatible Linux APT desktops, for both 64-bit Intel/AMD and ARM. Download the single `all.deb` setup package from this official release, open it with your desktop package installer (App Center on Ubuntu), install it, then open **Install Sovereign** from Applications. The window reviews its changes, verifies the exact app and software key, uses your system's permission dialog, and offers **Open Sovereign** when ready. No Skulk, account, GPU or terminal commands are required. Ubuntu 24.04 is the tested baseline, not an OS allowlist; APT checks the actual required libraries.

          A local .deb is trusted software: App Center's installation prompt does not itself authenticate Foxlight as publisher. This release publishes checksums and independently verifiable build provenance for advanced verification. The installed setup verifies its downstream inputs and preserves scoped APT signature/expiry checks; software authentication remains separate from model provenance and trust.

          Fresh native amd64/arm64 tests exercise real review cancellation, actual OS permission cancellation/password authentication, installation and graphical app handoff. Reproducible setup bytes match across both architectures. The existing app remains 0.1.0-3, core 0.26 / Library 0.22. Full App Center download handoff, participant usability, other distributions and model inference remain separate qualification. Installing setup alone starts no service, sharing or model work. Removing setup retains the app, Library and operator-controlled update source.

          [Instructions and verification](https://github.com/Foxlight-Foundation/foxlight-model-preservation/blob/main/docs/linux-distribution.md#graphical-setup-recommended)
          MD
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title 'Sovereign graphical Linux setup 0.1.3' --notes-file notes.md

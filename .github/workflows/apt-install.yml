name: Qualify public Sovereign apt installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install only test dependencies and the scoped public software key
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg python3-pyatspi at-spi2-core xvfb dbus-x11 xdotool
          curl --fail --silent --show-error https://apt.foxlight.ai/sovereign-archive-keyring.gpg -o /tmp/sovereign-archive-keyring.gpg
          echo 'f9a76cf4131603e3b7d905868efcf53f7ebea98ccdbfaf0d47ae0ac825cfd338  /tmp/sovereign-archive-keyring.gpg' | sha256sum --check --strict
          sudo install -m 0644 /tmp/sovereign-archive-keyring.gpg /usr/share/keyrings/sovereign-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/sovereign-archive-keyring.gpg] https://apt.foxlight.ai sovereign main' | sudo tee /etc/apt/sources.list.d/sovereign.list
      - name: Install from authenticated expiring public metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y foxlight-sovereign=0.1.0-3
          test "$(dpkg-query -W -f='${Version}' foxlight-sovereign)" = 0.1.0-3
          for package in skulk skulk-runtime skulk-desktop; do
            test "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" != installed
          done
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Verify the same downloaded package against public build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir /tmp/sovereign-public-package
          cd /tmp/sovereign-public-package
          apt-get download foxlight-sovereign=0.1.0-3
          gh release download sovereign-linux-v0.1.0-3 --repo "$GITHUB_REPOSITORY" --pattern linux-release.sigstore.json
          gh attestation verify "foxlight-sovereign_0.1.0-3_${ARCHITECTURE}.deb" \
            --repo "$GITHUB_REPOSITORY" --bundle linux-release.sigstore.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux-release.yml" \
            --source-ref refs/tags/sovereign-linux-v0.1.0-3 \
            --source-digest "$(git -C "$GITHUB_WORKSPACE" rev-parse 'refs/tags/sovereign-linux-v0.1.0-3^{commit}')" \
            --deny-self-hosted-runners
      - name: Use the installed app and commands without Skulk
        run: |
          cd /tmp
          dbus-run-session -- xvfb-run -a /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/qualify_linux.py" --directory /tmp/sovereign-public-apt-qualification
      - name: Recover a complete signed kit through the native GUI without any external network
        run: |
          sudo unshare --net /bin/bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1000x24" \
              /usr/bin/python3 -I -B "$2/scripts/qualify_linux_recovery.py" \
              --directory /tmp/sovereign-public-apt-recovery
          ' bash "$(id -un)" "$GITHUB_WORKSPACE"
      - name: Package removal retains all user files
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/sovereign-public-apt-qualification/native-library')
          (root / 'user-data').write_bytes(b'Operator-owned data.\n')
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          Path('/tmp/before-purge.json').write_text(json.dumps(files))
          PY
          sudo apt-get purge -y foxlight-sovereign
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/sovereign-public-apt-qualification/native-library')
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert files == json.loads(Path('/tmp/before-purge.json').read_bytes())
          record = Path('/tmp/sovereign-public-apt-qualification/qualification.json')
          evidence = json.loads(record.read_bytes())
          evidence.update(public_signed_apt_install=True, purge_retains_exact_user_files=True)
          record.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sovereign-public-apt-${{ matrix.architecture }}
          path: |
            /tmp/sovereign-public-apt-qualification/qualification.json
            /tmp/sovereign-public-apt-qualification/*.png
            /tmp/sovereign-public-apt-recovery/qualification.json
            /tmp/sovereign-public-apt-recovery/*.png
            /tmp/sovereign-public-apt-recovery/*.txt
            /tmp/sovereign-public-apt-recovery/*.log
          if-no-files-found: error
          retention-days: 30

name: Core conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run basedpyright
      - run: uv run pytest
      - name: Qualify optional BitTorrent with real local peers
        run: |
          uv sync --locked --dev --extra bittorrent
          uv run --extra bittorrent pytest tests/test_torrent.py tests/test_mirror_native.py tests/test_pirateface_native.py tests/test_i2p.py tests/test_i2p_runtime.py
      - run: uv build
      - name: Qualify the hash-locked public installation bundle
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python scripts/release_install.py --project . --dist dist --revision "$SOURCE_REVISION"
          python dist/install.py --directory /tmp/preservation-locked
          /tmp/preservation-locked/bin/python -c "import importlib.util; assert importlib.util.find_spec('skulk') is None; assert importlib.util.find_spec('skulk_capability_sdk') is None"
          /tmp/preservation-locked/bin/model-preserve mirror --help
      - name: Install the built wheel outside the checkout
        run: |
          python -m venv /tmp/preservation-wheel
          /tmp/preservation-wheel/bin/pip install dist/*.whl
          cp examples/conformance/card-v1.json /tmp/preservation-card-vector.json
          cp examples/conformance/pmf-v0.1.json /tmp/preservation-pmf-vector.json
          cd /tmp
          /tmp/preservation-wheel/bin/model-preserve --help
          /tmp/preservation-wheel/bin/python - <<'PY'
          import base64
          import json
          from datetime import datetime
          from pathlib import Path
          from importlib.resources import files
          from tempfile import TemporaryDirectory
          from foxlight_model_preservation.cards import identity_json
          from foxlight_model_preservation.models import TrustProfile
          from foxlight_model_preservation.pmf import restore_pmf, verify_pmf
          from foxlight_model_preservation.pmf_models import PMFManifest
          from foxlight_model_preservation.registry_proof import verify_registry_proof
          vector = json.loads(Path('preservation-card-vector.json').read_bytes())
          result = verify_registry_proof(
              identity_json(vector['proof']),
              base64.b64decode(vector['enrolled_root_base64']),
              vector['expected_card_id'],
              reference_time=datetime.fromisoformat(vector['reference_time']),
          )
          assert result.report.target_sha256 == vector['target_sha256']
          pmf = json.loads(Path('preservation-pmf-vector.json').read_bytes())
          schema = files('foxlight_model_preservation').joinpath(
              'resources/pmf_manifest_v0_1.json'
          )
          assert json.loads(schema.read_bytes()) == PMFManifest.model_json_schema()
          trust = TrustProfile.model_validate_json(json.dumps(pmf['trust']))
          with TemporaryDirectory() as temporary:
              root = Path(temporary)
              store = root / 'store'
              (store / 'manifests').mkdir(parents=True)
              (store / 'objects/sha256').mkdir(parents=True)
              (store / 'manifests' / (pmf['manifest_id'] + '.json')).write_bytes(
                  base64.b64decode(pmf['envelope_base64'])
              )
              for identity, value in pmf['objects_base64'].items():
                  (store / 'objects/sha256' / identity).write_bytes(base64.b64decode(value))
              verified = verify_pmf(store, pmf['manifest_id'], trust)
              assert restore_pmf(store, pmf['manifest_id'], trust, root / 'restored') == verified
              assert (root / 'restored/documents/foreign-card').read_bytes() == base64.b64decode(
                  pmf['objects_base64'][verified.documents[0].sha256]
              )
          PY
  peer:
    name: Stock Kubo peer conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --dev --extra peer
      - name: Verify the qualified public Kubo distribution
        run: |
          uv run model-preserve peer-runtime-plan
          uv run model-preserve peer-runtime-install --runtime-directory /tmp/preservation-runtime --allow-runtime-download
      - name: Qualify the real native mesh without public bootstrap services
        env:
          KUBO_BINARY: /tmp/preservation-runtime/kubo-0.43.1-linux-amd64/ipfs
        run: uv run --extra peer pytest tests/test_peer.py tests/test_peer_invitations.py tests/test_peer_native.py tests/test_handoffs.py tests/test_mirror_native.py

  i2p:
    name: Isolated native I2P recovery pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --dev --extra bittorrent
      - name: Verify the selected build tool
        run: |
          curl --fail --location --output /tmp/ant.tar.gz https://downloads.apache.org/ant/binaries/apache-ant-1.10.18-bin.tar.gz
          printf '%s  /tmp/ant.tar.gz\n' 'c510d744876d8da48dabc9495b023b6ec5284a0f18b40ee50d98ce099e791ca5c73e3cd4c80d3c90d3efc03f9620be43aad0a373ed47198284f7e3373e0db2c3' | sha512sum --check
          tar -xzf /tmp/ant.tar.gz -C /tmp
      - name: Build the pinned native sources without starting a public router
        run: |
          python scripts/build_i2p_runtime.py --directory /tmp/sovereign-i2p-build --java-home "$JAVA_HOME" --ant /tmp/apache-ant-1.10.18/bin/ant --allow-source-download
      - name: Build the stock I2P HTTP proxy/server for isolated conformance
        working-directory: /tmp/sovereign-i2p-build/i2p
        run: /tmp/apache-ant-1.10.18/bin/ant -q -Drequire.gettext=false buildI2PTunnelJars
      - name: Transfer synthetic PMF through private I2P DHT and check crash fencing
        env:
          SOVEREIGN_I2P_RUNTIME: /tmp/sovereign-i2p-build/runtime
          SOVEREIGN_I2P_JAVA_HOME: ${{ env.JAVA_HOME }}
          SOVEREIGN_I2P_ROUTER_JAR: /tmp/sovereign-i2p-build/i2p/build/router.jar
          SOVEREIGN_I2P_TUNNEL_JAR: /tmp/sovereign-i2p-build/i2p/build/i2ptunnel.jar
        run: uv run --extra bittorrent pytest tests/test_i2p.py tests/test_i2p_runtime.py tests/test_i2p_native.py tests/test_i2p_http.py tests/test_i2p_http_native.py --basetemp=/tmp/sovereign-i2p-conformance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-i2p-conformance
          path: /tmp/sovereign-i2p-conformance
          retention-days: 7

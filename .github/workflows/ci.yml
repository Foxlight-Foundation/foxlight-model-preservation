name: Core conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run basedpyright
      - run: uv run pytest
      - run: uv build
      - name: Install the built wheel outside the checkout
        run: |
          python -m venv /tmp/preservation-wheel
          /tmp/preservation-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/preservation-wheel/bin/model-preserve --help

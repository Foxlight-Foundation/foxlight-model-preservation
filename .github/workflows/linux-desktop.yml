name: Independent Linux desktop
on:
  workflow_call:
  push:
    paths: ['desktop/linux/**', 'desktop/macos/cli/native-cli.py', 'scripts/build_linux.py', 'scripts/build_macos.py', 'scripts/qualify_linux.py', 'tests/test_linux_desktop.py', '.github/workflows/linux-desktop.yml']
  pull_request:
    paths: ['desktop/linux/**', 'desktop/macos/cli/native-cli.py', 'scripts/build_linux.py', 'scripts/build_macos.py', 'scripts/qualify_linux.py', 'tests/test_linux_desktop.py', '.github/workflows/linux-desktop.yml']
permissions:
  contents: read
jobs:
  candidate:
    name: Ubuntu 24.04 ${{ matrix.architecture }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - name: Install native desktop and package-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pyatspi at-spi2-core gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb dbus-x11 zstd desktop-file-utils
      - name: Fetch only pinned public inputs and hash-locked wheels
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, sys, urllib.request
          sys.path.insert(0, 'scripts')
          from build_macos import extract_library
          lock = json.loads(pathlib.Path('desktop/linux/inputs.json').read_bytes())
          selected = lock['architectures'][os.environ['ARCHITECTURE']]
          for name, item in [('library', lock['library']), ('python', selected['python']), ('notices', selected['notices'])]:
              path = pathlib.Path('/tmp/' + name + '.archive')
              urllib.request.urlretrieve(item['url'], path)
              assert hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() == item['sha256']
          extract_library(pathlib.Path('/tmp/library.archive'), pathlib.Path('/tmp/sovereign-software'))
          PY
          python -m pip download --only-binary=:all: --require-hashes --find-links /tmp/sovereign-software --dest /tmp/sovereign-wheelhouse -r /tmp/sovereign-software/requirements-desktop.lock
      - name: Build twice offline and require reproducible package bytes
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python scripts/build_linux.py --architecture "$ARCHITECTURE" --library-archive /tmp/library.archive --python-archive /tmp/python.archive --notices-archive /tmp/notices.archive --wheelhouse /tmp/sovereign-wheelhouse --directory /tmp/sovereign-linux-a
          python scripts/build_linux.py --architecture "$ARCHITECTURE" --library-archive /tmp/library.archive --python-archive /tmp/python.archive --notices-archive /tmp/notices.archive --wheelhouse /tmp/sovereign-wheelhouse --directory /tmp/sovereign-linux-b
          cmp /tmp/sovereign-linux-a/*.deb /tmp/sovereign-linux-b/*.deb
          desktop-file-validate /tmp/sovereign-linux-a/package/usr/share/applications/ai.foxlight.Sovereign.desktop
          test "$(find /tmp/sovereign-linux-a/package/DEBIAN -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'conffiles control postinst postrm '
          test -z "$(find /tmp/sovereign-linux-a/package -iname '*systemd*' -o -iname '*cron*')"
      - name: Install the actual package and exercise its native session
        run: |
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns > /tmp/sovereign-userns-before
          test "$(cat /tmp/sovereign-userns-before)" = 1
          sudo apt-get install -y /tmp/sovereign-linux-a/*.deb
          cd /tmp
          dbus-run-session -- xvfb-run -a /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/qualify_linux.py" --directory /tmp/sovereign-linux-qualification
      - name: Uninstall retains exact user-owned files
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('/tmp/sovereign-linux-qualification/native-library')
          (root / 'retained-user-file').write_bytes(b'User data must survive package removal.\n')
          values = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in root.rglob('*') if path.is_file()}
          pathlib.Path('/tmp/sovereign-linux-retained.json').write_text(json.dumps(values))
          PY
          sudo apt-get purge -y foxlight-sovereign
          cmp /tmp/sovereign-userns-before /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('/tmp/sovereign-linux-qualification/native-library')
          actual = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in root.rglob('*') if path.is_file()}
          assert actual == json.loads(pathlib.Path('/tmp/sovereign-linux-retained.json').read_bytes())
          record = pathlib.Path('/tmp/sovereign-linux-qualification/qualification.json')
          evidence = json.loads(record.read_bytes())
          evidence['purge_retains_exact_user_files'] = True
          record.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Stage one flat candidate inventory for release intake
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib, shutil
          destination = pathlib.Path('/tmp/sovereign-linux-artifact')
          destination.mkdir()
          paths = list(pathlib.Path('/tmp/sovereign-linux-a').glob('*.deb'))
          paths += [pathlib.Path('/tmp/sovereign-linux-a/SHA256SUMS'), pathlib.Path('/tmp/sovereign-linux-a/package/opt/foxlight/sovereign/build-receipt.json'), pathlib.Path('/tmp/sovereign-linux-qualification/qualification.json')]
          paths += list(pathlib.Path('/tmp/sovereign-linux-qualification').glob('*.png'))
          for path in paths:
              if path.is_file():
                  shutil.copyfile(path, destination / path.name)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovereign-linux-${{ matrix.architecture }}-candidate
          path: /tmp/sovereign-linux-artifact/*

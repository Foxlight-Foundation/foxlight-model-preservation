name: Library interface
on:
  push:
    paths: ['capability/**', 'src/foxlight_model_preservation/local_host/**', 'desktop/**', 'scripts/*macos.py', 'scripts/package_desktop.py', 'scripts/release_install.py', 'scripts/install_release.py', 'scripts/qualify_installed_desktop.py', '.github/workflows/library-ui.yml']
  pull_request:
    paths: ['capability/**', 'src/foxlight_model_preservation/local_host/**', 'desktop/**', 'scripts/*macos.py', 'scripts/package_desktop.py', 'scripts/release_install.py', 'scripts/install_release.py', 'scripts/qualify_installed_desktop.py', '.github/workflows/library-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capability/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: capability/web/package-lock.json
      - run: npm ci
      - name: Require the committed interface bundle to match a clean build
        run: |
          npm run build
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: npx playwright install --with-deps chromium
      - run: npm test

  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv build --project capability --out-dir dist-library
      - run: uv build --wheel --out-dir dist-core
      - name: Install only the public wheel and exercise its local screen
        run: |
          python scripts/release_install.py --project capability --dist dist-library --revision "$GITHUB_SHA" --desktop-core-wheel dist-core/*.whl
          python dist-library/install.py --directory /tmp/library-public
          uv pip install --python /tmp/library-public/bin/python pytest pytest-asyncio
          cd /tmp
          /tmp/library-public/bin/python -c "import importlib.util; assert importlib.util.find_spec('skulk_capability_sdk') is None; assert importlib.util.find_spec('skulk') is None; assert importlib.util.find_spec('foxlight_model_preservation') is None"
          /tmp/library-public/bin/foxlight-preservation-library --help
          /tmp/library-public/bin/python -c "import os; from foxlight_preservation_library.preview import _library_source; assert _library_source() == 'git+https://github.com/Foxlight-Foundation/foxlight-model-preservation.git@' + os.environ['GITHUB_SHA'] + '#subdirectory=capability'"
          /tmp/library-public/bin/python -m pytest "$GITHUB_WORKSPACE/capability/tests/test_standalone.py" "$GITHUB_WORKSPACE/capability/tests/test_delivery.py" "$GITHUB_WORKSPACE/capability/tests/test_storage.py" "$GITHUB_WORKSPACE/capability/tests/test_compatibility.py" "$GITHUB_WORKSPACE/capability/tests/test_preview.py" "$GITHUB_WORKSPACE/capability/tests/test_discovery.py" "$GITHUB_WORKSPACE/capability/tests/test_bundle_version.py" "$GITHUB_WORKSPACE/capability/tests/test_handoffs.py" "$GITHUB_WORKSPACE/capability/tests/test_mirrors.py" "$GITHUB_WORKSPACE/capability/tests/test_mirror_recovery.py" "$GITHUB_WORKSPACE/capability/tests/test_pending_recovery.py" -q
      - name: Exercise the independently installed owner without Core or SDK
        run: |
          python dist-library/install.py --directory /tmp/sovereign-public --requirements requirements-desktop.lock
          /tmp/sovereign-public/bin/python -I scripts/qualify_installed_desktop.py
          python -m pip download --require-hashes --only-binary=:all: --find-links dist-library --dest /tmp/desktop-wheelhouse -r dist-library/requirements-desktop.lock
          python dist-library/install.py --directory /tmp/sovereign-offline --requirements requirements-desktop.lock --offline --wheelhouse /tmp/desktop-wheelhouse
          /tmp/sovereign-offline/bin/python -I scripts/qualify_installed_desktop.py
          uv pip install --python /tmp/sovereign-public/bin/python pytest pytest-asyncio
          cd /tmp
          /tmp/sovereign-public/bin/foxlight-sovereign --help
          /tmp/sovereign-public/bin/python -m pytest "$GITHUB_WORKSPACE/capability/tests/test_desktop.py" -q
      - uses: actions/upload-artifact@v4
        with:
          name: preservation-library-public
          path: dist-library/*

  mac-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the native shell
        run: swift build --package-path desktop/macos --scratch-path /tmp/sovereign-swift

  mac-bundle:
    name: Independent Apple silicon bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - name: Fetch and verify pinned public inputs
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile
          lock = json.loads(pathlib.Path('desktop/macos/inputs.json').read_bytes())
          for name in ('library', 'python'):
              urllib.request.urlretrieve(lock[name]['url'], '/tmp/' + name + '.archive')
              assert hashlib.sha256(pathlib.Path('/tmp/' + name + '.archive').read_bytes()).hexdigest() == lock[name]['sha256']
          with zipfile.ZipFile('/tmp/library.archive') as archive:
              archive.extractall('/tmp/sovereign-software')
          PY
          python -m pip download --only-binary=:all: --require-hashes --find-links /tmp/sovereign-software --dest /tmp/sovereign-wheelhouse -r /tmp/sovereign-software/requirements-desktop.lock
      - name: Build the complete offline candidate
        run: |
          python scripts/build_macos.py --library-archive /tmp/library.archive --python-archive /tmp/python.archive --wheelhouse /tmp/sovereign-wheelhouse --directory /tmp/sovereign-native
          codesign --verify --strict /tmp/sovereign-native/Sovereign.app
      - name: Exercise bundled runtime outside the checkout
        run: |
          cd /tmp
          /tmp/sovereign-native/Sovereign.app/Contents/Resources/python/bin/python3 -I -B - <<'PY'
          import importlib.util, pathlib, runpy, sys
          sys.path.insert(0, '/tmp/sovereign-native/Sovereign.app/Contents/Resources/site-packages')
          assert importlib.util.find_spec('skulk') is None
          assert importlib.util.find_spec('skulk_capability_sdk') is None
          from foxlight_model_preservation import pmf
          from foxlight_preservation_library.desktop import DesktopClient
          sys.argv = ['foxlight-sovereign', '--help']
          runpy.run_module('foxlight_preservation_library.desktop', run_name='__main__')
          PY
